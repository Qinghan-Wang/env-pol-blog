  <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5"
          orient="auto-start-reverse">
    <path d="M0,1.4 L9.2,5 L0,8.6 z" fill="#7c7566"/>
  </marker>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.05" fill="#ddd6c7"/>
  </pattern>
</defs>
