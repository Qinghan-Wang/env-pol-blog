<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 790" width="1110" height="790" role="img" aria-labelledby="f1title f1desc" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="f1title">Figure 1. How AI data centers create direct and indirect water demand</title>
<desc id="f1desc">Flow chart: AI computing demand drives data center electricity demand and server heat. Electricity demand leads to power generation and indirect water use; server heat leads to the cooling system, which produces direct water use. Air cooling or closed-loop cooling may reduce on-site water use. Indirect and direct water use together make up the overall water footprint, whose local effects depend on water source, climate, cooling technology and facility concentration.</desc>
