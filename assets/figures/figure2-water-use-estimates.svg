<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="f2title f2desc" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="f2title">Figure 2. Data center water use in Arizona: a statewide estimate and a facility-level estimate</title>
<desc id="f2desc">Two data cards. Card one: Arizona, 2025 estimate, 905 million gallons per year, estimated statewide water consumption by data centers, Circle of Blue (2025). Card two: Microsoft Goodyear, 56 million gallons per year, estimated potable-water use at one facility, APM Research Lab (2025). The two figures have different scopes and measure different things.</desc>
<defs>
  <pattern id="dots2" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.05" fill="#ddd6c7"/>
  </pattern>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<rect width="1000" height="470" fill="url(#dots2)" opacity="0.75"/>
<g><rect x="40" y="44" width="440" height="300" rx="14" fill="#eef4fa" stroke="#2b5c8a" stroke-width="2"/>
<rect x="40" y="44" width="440" height="8" rx="4" fill="#2b5c8a"/>
<text x="68" y="92" font-size="13.5" font-weight="700" letter-spacing="1.1" fill="#2b5c8a">ARIZONA · 2025 ESTIMATE</text>
<text x="68" y="164" font-size="46" font-weight="700" fill="#2b5c8a">905 million</text>
<text x="68" y="192" font-size="16" font-weight="600" fill="#4a453a">gallons per year</text>
<rect x="68" y="214" width="244" height="26" rx="13" fill="#ffffff" stroke="#2b5c8a" stroke-width="1.2"/>
<text x="190" y="231" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2b5c8a">Statewide · water consumption</text>
<text x="68" y="272" font-size="14.5" fill="#3f3a31">Estimated water consumption by data centers</text>
<text x="68" y="293" font-size="14.5" fill="#3f3a31">across Arizona.</text>
<text x="68" y="324" font-size="12.5" font-style="italic" fill="#6b6456">Source: Circle of Blue (2025)</text>
</g>
<g><rect x="520" y="44" width="440" height="300" rx="14" fill="#eaf5f2" stroke="#1c6f66" stroke-width="2"/>
<rect x="520" y="44" width="440" height="8" rx="4" fill="#1c6f66"/>
<text x="548" y="92" font-size="13.5" font-weight="700" letter-spacing="1.1" fill="#1c6f66">MICROSOFT · GOODYEAR</text>
<text x="548" y="164" font-size="46" font-weight="700" fill="#1c6f66">56 million</text>
<text x="548" y="192" font-size="16" font-weight="600" fill="#4a453a">gallons per year</text>
<rect x="548" y="214" width="236" height="26" rx="13" fill="#ffffff" stroke="#1c6f66" stroke-width="1.2"/>
<text x="666" y="231" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1c6f66">One facility · potable water</text>
<text x="548" y="272" font-size="14.5" fill="#3f3a31">Reported estimate of potable-water use at a</text>
<text x="548" y="293" font-size="14.5" fill="#3f3a31">single facility.</text>
<text x="548" y="324" font-size="12.5" font-style="italic" fill="#6b6456">Source: APM Research Lab (2025)</text>
</g>
<g>
<rect x="40" y="372" width="920" height="70" rx="12" fill="#fbf1dc" stroke="#a8761d" stroke-width="1.8"/>
<text x="500" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#6f4a0f">DIFFERENT SCOPES, DIFFERENT MEASURES</text>
<text x="500" y="424" font-size="14" text-anchor="middle" fill="#5d4310">A statewide consumption estimate and a single-facility potable-water estimate are not like-for-like figures.</text>
</g>
</svg>